<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2334A853'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transfer Atlas — AgriHub·AI</title>
<meta name="description" content="Pick a crop and a goal. The Atlas shows which gene already solved it somewhere, how far it has been taken, whether the patent space is occupied, and where to look next.">
<style>
  :root{
    --txt:#1C1C1E; --txt2:#6C6C70; --txt3:#8E8E93;
    --blue:#007AFF; --blue-d:#0A63C9;
    --fill:#F2F2F7; --sep:#D8D8DC; --card:#fff;
    --ok-bg:#DFF6E5; --ok-fg:#14702B; --ok-dot:#30D158;
    --mid-bg:#FFEBCF; --mid-fg:#9A5300; --mid-dot:#FF9F0A;
    --off-bg:#EFEFF4; --off-fg:#6C6C70; --off-dot:#B8B8BE;
    --cis-bg:#DCEBFF; --cis-fg:#0A5BC4; --cis-dot:#007AFF;
    --hot-bg:#FFE3DF; --hot-fg:#A3271A; --hot-dot:#FF453A;
    --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:#fff;color:var(--txt);-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
    letter-spacing:-0.01em;
  }
  a{color:var(--blue);text-decoration:none}
  a:hover{color:var(--blue-d)}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px 56px}
  .head{padding-top:48px}
  .kicker{font-size:13px;font-weight:600;color:var(--txt2)}
  .kline{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .lang{display:flex;background:var(--fill);border-radius:8px;padding:2px;flex:none}
  .lang button{border:none;background:transparent;cursor:pointer;color:var(--txt2);
    font:600 12px inherit;padding:4px 9px;border-radius:6px}
  .lang button[aria-pressed=true]{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .kicker span{color:#34A853}
  h1{font-size:34px;font-weight:700;letter-spacing:-0.025em;margin:8px 0 6px}
  .sub{font-size:16px;line-height:1.35;color:var(--txt2);margin:0 0 20px;text-wrap:pretty}

  /* segmented control */
  .seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 18px}
  .seg button{
    flex:1;border:none;background:transparent;cursor:pointer;color:var(--txt);
    font:500 13px inherit;padding:7px 0;border-radius:7px;letter-spacing:-0.01em;
  }
  .seg button[aria-selected=true]{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}

  /* filter list */
  .list{background:var(--fill);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 16px;border-bottom:.5px solid var(--sep)}
  .row:last-child{border-bottom:0}
  .row label{font-size:17px;width:104px;flex:none}
  .row select{
    flex:1;border:none;background:transparent;text-align:right;color:var(--blue);
    font:400 17px inherit;letter-spacing:-0.01em;cursor:pointer;
    -webkit-appearance:none;appearance:none;padding-right:2px;direction:rtl;
  }
  .row select:focus{outline:none}
  .chev{color:var(--txt3);font-size:14px;flex:none}

  .count{font-size:13px;color:var(--txt3);margin:0 2px 10px;display:flex;justify-content:space-between}
  .count b{font-weight:600;color:var(--txt2)}

  /* cards */
  .card{
    background:var(--card);border-radius:var(--r);box-shadow:0 0 0 .5px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.05);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;
  }
  .card:hover{box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08)}
  .rail{position:absolute;left:0;top:0;bottom:0;width:3px}
  .card .top{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .trait{font-size:17px;font-weight:600;flex:1;line-height:1.25}
  .crop{font-size:13px;color:var(--txt3);flex:none}
  .gives{font-size:14px;color:var(--txt2);margin:4px 0 9px;line-height:1.4;text-wrap:pretty}
  .gene{font-size:13px;color:var(--txt3);margin:8px 0 0;font-variant-ligatures:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .dot{width:7px;height:7px;border-radius:4px;flex:none}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
  .scrim.on{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;
    border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;display:none;
    padding:0 20px 36px;box-shadow:0 -8px 40px rgba(0,0,0,.2);
  }
  .sheet.on{display:block}
  @media(min-width:600px){
    .sheet{left:50%;transform:translateX(-50%);max-width:560px;border-radius:16px;bottom:4vh;max-height:84vh}
  }
  .grab{position:sticky;top:0;background:#fff;padding:10px 0 4px;z-index:1}
  .grab i{display:block;width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto}
  .sh-close{position:absolute;right:16px;top:14px;border:none;background:var(--fill);color:var(--txt2);
    width:30px;height:30px;border-radius:15px;font:600 15px inherit;cursor:pointer}
  .sh-trait{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin:6px 0 2px;padding-right:40px}
  .sh-crop{font-size:14px;color:var(--txt3);margin-bottom:12px}
  .sh-crop i{font-style:italic}
  h3{font-size:12px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:14px;line-height:1.4}
  .kv dt{color:var(--txt3)}
  .kv dd{color:var(--txt)}
  .note{font-size:13px;line-height:1.45;color:var(--txt2);background:var(--fill);border-radius:10px;padding:10px 12px;margin-top:8px}
  .note.warn{background:#FFF6E5;color:#6B4500}
  .note.flat{background:transparent;padding:0}
  .glist{list-style:none;display:flex;flex-direction:column;gap:8px}
  .glist li{border:.5px solid var(--sep);border-radius:10px;padding:9px 11px}
  .gname{font-size:15px;font-weight:600}
  .gmeta{font-size:12px;color:var(--txt3);margin-top:2px;line-height:1.4}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .lk{font-size:12px;font-weight:500;padding:4px 9px;border-radius:7px;background:var(--fill);color:var(--blue)}
  .lk:hover{background:#E6E6EB}
  .lk.off{color:var(--txt3);pointer-events:none}
  .matrix{display:flex;flex-direction:column;gap:6px}
  .mrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 11px;border-radius:10px;background:var(--fill)}
  .mrow.pick{background:var(--ok-bg);color:var(--ok-fg);font-weight:600}
  .mrow .m1{flex:1}
  .lead{font-size:16px;line-height:1.45;margin:14px 0 0;text-wrap:pretty}
  .lead-lab{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:3px}
  .tiny{font-size:12px;color:var(--txt3);line-height:1.45;margin-top:8px}
  ol.todo{margin:8px 0 0 18px;font-size:14px;line-height:1.5;color:var(--txt2)}
  ol.todo li{margin-bottom:6px}
  ol.todo b{color:var(--txt);font-weight:600}
  .stand{display:flex;flex-direction:column;gap:8px}
  .stand .srow{border:.5px solid var(--sep);border-radius:10px;padding:9px 11px}
  .stand .sq{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:5px}
  .stand .sv{font-size:13px;color:var(--txt2);line-height:1.45;margin-top:5px}
  details.tech{border:.5px solid var(--sep);border-radius:10px;margin-top:16px;overflow:hidden}
  details.tech summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;
    font-weight:600;color:var(--txt2)}
  details.tech summary::-webkit-details-marker{display:none}
  details.tech summary::after{content:'＋';float:right;color:var(--txt3);font-weight:400}
  details.tech[open] summary::after{content:'－'}
  details.tech .tbody{padding:0 12px 14px;border-top:.5px solid var(--sep)}
  details.tech h3:first-of-type{margin-top:14px}
  .empty{text-align:center;color:var(--txt3);font-size:15px;padding:40px 20px;line-height:1.5}
  footer{margin-top:34px;padding-top:18px;border-top:.5px solid var(--sep);font-size:12px;line-height:1.55;color:var(--txt3)}
  footer p{margin-bottom:8px}
  .skel{height:74px;background:var(--fill);border-radius:var(--r);margin-bottom:10px;animation:p 1.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kline">
      <div class="kicker">AgriHub<span>·AI</span> · proof-of-concept</div>
      <div class="lang">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="tr" aria-pressed="false">TR</button>
      </div>
    </div>
    <h1>Transfer Atlas</h1>
    <p class="sub" id="t-sub"></p>
  </div>

  <div class="seg" role="tablist">
    <button role="tab" aria-selected="true" data-tab="explore" id="t-tab1"></button>
    <button role="tab" aria-selected="false" data-tab="frontier" id="t-tab2"></button>
    <button role="tab" aria-selected="false" data-tab="about" id="t-tab3"></button>
  </div>

  <div id="panel-explore">
    <div class="list">
      <div class="row"><label for="f-crop" id="t-lcrop"></label>
        <select id="f-crop"></select><span class="chev">⌄</span></div>
      <div class="row"><label for="f-goal" id="t-lgoal"></label>
        <select id="f-goal"></select><span class="chev">⌄</span></div>
    </div>
    <div class="count"><span id="count">—</span><span id="asof"></span></div>
    <div id="results"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <p class="tiny" style="margin-top:14px"><a href="#" id="legend-link"></a></p>
  </div>

  <div id="panel-frontier" hidden>
    <p class="sub" style="font-size:15px" id="t-frontier"></p>
    <div id="frontier"></div>
  </div>

  <div id="panel-about" hidden>
    <div id="about-body"></div>
  </div>

  <footer id="foot"></footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Entry detail"></div>
<script>
'use strict';

/* ============================================================
   Plain-language vocabularies.
   Every label restates something the entry already carries.
   READY comes from evidence.derived_level, which is itself derived from what
   the verification pipeline could confirm — never from a draft's claim.
   ============================================================ */

const READY = {
  'Level 1': {tone:'ok', order:0,
    en:{label:'Used in a product',
        means:'A product on sale was made by this same route. It has been taken all the way out of the lab at least once.'},
    tr:{label:'Üründe kullanılmış',
        means:'Satıştaki bir ürün bu yolla yapılmış. Yani bu çözüm en az bir kez laboratuvarın dışına çıkarılmış.'}},
  'Level 2': {tone:'cis', order:1,
    en:{label:'Proven in plants',
        means:'Edited or mutant plants exist and behave as described, and the cited paper checks out. No product yet — this is where a commercial candidate starts.'},
    tr:{label:'Bitkide kanıtlanmış',
        means:'Düzenlenmiş ya da mutant bitkiler var ve anlatıldığı gibi davranıyor; atıf verilen makale de doğrulandı. Henüz ürün yok — ticari aday buradan çıkar.'}},
  'Level 3': {tone:'mid', order:2,
    en:{label:'Documented, gene not pinned',
        means:'The paper is confirmed, but not every gene named here resolves to a database record. The biology is documented; the exact target is not nailed down.'},
    tr:{label:'Belgelenmiş, gen sabitlenmemiş',
        means:'Makale doğrulandı, ama burada adı geçen her gen bir veritabanı kaydına oturmuyor. Biyoloji belgelenmiş; hedefin tam kendisi netleşmemiş.'}},
  'Level 4': {tone:'mid', order:3,
    en:{label:'Candidate gene',
        means:'The gene records resolve, but no paper confirming this use could be verified. A lead to check, not a target to edit.'},
    tr:{label:'Aday gen',
        means:'Gen kayıtları doğrulandı, ama bu kullanımı doğrulayan bir makale teyit edilemedi. Düzenlenecek hedef değil, kontrol edilecek bir ipucu.'}},
  'Level 5': {tone:'off', order:4,
    en:{label:'Open question',
        means:'Neither a gene record nor a confirming paper resolved. Kept visible because the gap itself is worth knowing about.'},
    tr:{label:'Açık soru',
        means:'Ne gen kaydı ne de doğrulayıcı makale oturdu. Boşluğun kendisi bilmeye değer olduğu için görünür bırakıldı.'}},
  '': {tone:'off', order:5,
    en:{label:'Not graded', means:'No readiness level was derived for this entry.'},
    tr:{label:'Derecelendirilmemiş', means:'Bu kayıt için hazırlık düzeyi türetilmedi.'}}
};

const ROUTE = {
  t1:{tone:'ok', order:0,
    en:{label:"Edit the crop's own gene",
        means:"The gene is already in your crop; you change its own sequence. Candidate for the EU NGT category-1 route, and it drags nothing else along."},
    tr:{label:'Kendi geninde düzenleme',
        means:'Gen zaten senin üründe; kendi dizisini değiştiriyorsun. AB NGT kategori-1 yolu için aday ve yanında başka hiçbir şey sürüklemiyor.'}},
  t2:{tone:'cis', order:1,
    en:{label:'Cross from a wild relative',
        means:'The solution sits in a crossable relative. Classical introgression works, but it carries the neighbouring genes with it.'},
    tr:{label:'Yabani akrabadan aktarım',
        means:'Çözüm melezlenebilir bir akrabada. Klasik introgresyon işe yarar, ama komşu genleri de beraberinde getirir.'}},
  t3:{tone:'mid', order:2,
    en:{label:'Transgenic',
        means:'The gene comes from outside the crop gene pool. A different regulatory track entirely.'},
    tr:{label:'Transgenik',
        means:'Gen, ürünün gen havuzunun dışından geliyor. Tamamen farklı bir mevzuat yolu.'}}
};

const IP = {
  named:{tone:'hot',
    en:{label:'Filings named — assume occupied',
        means:'A company or institute is named as holding filings on this gene or use. Assume the space is taken until your own search says otherwise.'},
    tr:{label:'Başvuru sahibi belli — dolu varsay',
        means:'Bu gen ya da kullanım üzerinde başvurusu olan bir şirket veya enstitü adlandırılmış. Kendi aramanı yapana kadar alanı dolu varsay.'}},
  examined:{tone:'hot',
    en:{label:'Claims examined',
        means:'Actual patent claims were pulled and read for this entry. The detail below says which rights are live and what they cover.'},
    tr:{label:'İstemler okundu',
        means:'Bu kayıt için gerçek patent istemleri çekilip okundu. Aşağıdaki detay hangi hakların yürürlükte olduğunu ve neyi kapsadığını söylüyor.'}},
  crowded:{tone:'mid',
    en:{label:'Crowded area',
        means:'Many filings touch these genes. No single owner was identified.'},
    tr:{label:'Kalabalık alan',
        means:'Bu genlere dokunan çok sayıda başvuru var. Tek bir sahip belirlenemedi.'}},
  unchecked:{tone:'mid',
    en:{label:'Not searched yet',
        means:'Nobody has run the patent search for this entry. The link below starts it.'},
    tr:{label:'Henüz aranmadı',
        means:'Bu kayıt için patent araması kimse tarafından yapılmadı. Aşağıdaki bağlantı aramayı başlatır.'}},
  open:{tone:'off',
    en:{label:'Public, no filing named',
        means:'The locus is publicly characterised and no filing was recorded here. That is not a clearance — it only means nothing was found.'},
    tr:{label:'Açık, başvuru kaydı yok',
        means:'Lokus kamuya açık biçimde tanımlanmış ve burada bir başvuru kaydedilmemiş. Bu bir serbestlik belgesi değil — yalnızca bir şey bulunmadığı anlamına gelir.'}}
};

/* ---------- interface strings ---------- */

    gFound:'database record found in', gAs:'as', gGenbank:'pinned by GenBank record',
    gNone:'no database record resolved for this symbol — the locus-tag links below are the place to look',
    gNoGenes:'No gene symbols parsed for this entry.',
    locusBox:'Genome-database locus IDs for this entry — the crop databases, not NCBI',
    lGene:'Gene record', lPaper:'Read the paper', lBlast:'BLAST it', lFindSeq:'Find a sequence to BLAST',
    lPatent:'Patent search', lPapers:'Papers on this gene',
    tech:'Technical detail — verification, curation, full records',
    techNote:'The records below are kept in English: they are what the databases and the curation log returned, word for word.',
    tRecords:'What the entry records', tReady:'Readiness, derived', tLevel:'Level', tDraft:'Draft claimed',
    tVer:'Verification', tGenesRes:'genes resolved', tChecked:'checked',
    tDraftNote:'Draft note, not verified:', tLocus:'Locus IDs checked', tRoute:'Breeding route considered',
    tDecision:'Curated decision', tWhyNot:'Why not "used in a product"', tOpen:'Open question',
    tCand:'Candidate gene in the target crop', tGene:'Gene', tStatus:'Status', tLoc:'Location',
    tClaims:'Patent claims, as read', tClaimChecked:'Claim checked', tHolds:'What holds up',
    tWrong:'What turned out wrong', tLive:'Live rights to clear', tMissing:'Still missing',
    tDisc:'Patent lines are a research signal — not legal advice and not a freedom-to-operate opinion.',
    recommended:'recommended',
    strategies:['Genome editing (CRISPR / base / promoter)','Marker-assisted selection','Genomic selection','Classical introgression'],
    kvLabels:['Documented in','Status in target','Gene function','Gene action','Inheritance','Tissue','Editing route','Conventional route','Locus IDs','Commercial product','Linkage drag','Side effects','Environment','Reference cited'],
    foot:['<b>Gene identity and references</b> are machine-verified against NCBI Gene and PubMed by <code>scripts/verify_genes.py</code>, which records only what the databases return.',

    step1:'Ürün', step2:'Hedef',
    tab1:'Keşfet', tab2:'Sınırlar', tab3:'Etiketler ve yöntem',
    frontierIntro:'Doğrulanmış bir lokus yerine gen ailesi adlandıran kayıtlar. Bunlar düzenlenmeye hazır hedefler değil, araştırma soruları — boşluk açıkça görünsün diye burada duruyorlar.',
    allCrops:'Tüm ürünler', anything:'Her şey', pickCrop:'Ürün seç…', pickGoal:'Hedef seç…',

let ATLAS = null, PLAIN = {}, GOALS = {}, GOALS_TR = {}, CROPS_TR = {}, SHOWN = [];
/* CROP: '' = nothing chosen yet (list stays closed), '*' = all crops, else one crop. */
let CROP = '', GOAL = '', LANG = 'en';
const ALL = '*';

const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = () => T[LANG];
const L = o => o[LANG] || o.en;                       // label pack for the active language
const TONE = x => ({bg:`var(--${x}-bg)`, fg:`var(--${x}-fg)`, dot:`var(--${x}-dot)`});
const chip = (tone, label) =>
  `<span class="chip" style="background:${TONE(tone).bg};color:${TONE(tone).fg}"><i class="dot" style="background:${TONE(tone).dot}"></i>${esc(label)}</span>`;

const plain = e => PLAIN[e.id] || {};
/* The Turkish lines live under .tr; fall back to English when one is missing. */
const say = (e, field) => {
  const p = plain(e);
  return (LANG === 'tr' && p.tr && p.tr[field]) ? p.tr[field] : p[field];
};
const cropName = c => (LANG === 'tr' && CROPS_TR[c]) ? CROPS_TR[c] : c;
const goalName = g => (LANG === 'tr' && GOALS_TR[g]) ? GOALS_TR[g] : GOALS[g];
const ready = e => READY[(e.evidence || {}).derived_level || ''] || READY[''];
const route = e => ROUTE[e.portability] || ROUTE.t1;

/* On a card the goal reads better without the "I want" opener; the sheet keeps
   the breeder's own sentence whole. */
const goalPhrase = e => {
  const a = say(e, 'ask');
  if (!a) return e.trait;
  // English opens with "I want ..."; Turkish closes with "... istiyorum."
  const s = LANG === 'tr'
    ? a.replace(/\s*istiyorum\s*\.?\s*$/i, '.')
    : a.replace(/^I want (to )?/i, '');
  return s.charAt(0).toUpperCase() + s.slice(1);
};

/* Patent state, read off what the entry records — never inferred beyond it. */
function ipState(e){
  if ((e.correction || {}).ip_signal) return IP.examined;
  const p = (e.claims.patent_reference || '').trim();
  if (!p || /^n\/a$/i.test(p)) return IP.open;
  if (/^check/i.test(p)) return IP.unchecked;
  if (/^publicly/i.test(p)) return IP.open;
  if (/^broad landscape/i.test(p)) return IP.crowded;
  return IP.named;
}

/* ---------- where to look next ---------- */
function geneLinks(gene, entry){
  const v = gene.verification || {};
  const hit = ((v.ncbi_gene || {}).hits || [])[0];
  const gl = v.genbank_locus;
  const pm = ((v.pubmed || {}).hits || [])[0];
  const sp = entry.scientific_name || '';
  const out = [];
  if (hit) out.push([t().lGene, `https://www.ncbi.nlm.nih.gov/gene/${hit.ncbi_gene_id}`, 0]);
  if (gl && gl.accession) out.push([`GenBank ${gl.accession}`,
    `https://www.ncbi.nlm.nih.gov/nuccore/${encodeURIComponent(gl.accession)}`, 0]);
  if (pm) out.push([t().lPaper, `https://pubmed.ncbi.nlm.nih.gov/${pm.pmid}/`, 0]);
  if (pm && pm.doi) out.push(['DOI', `https://doi.org/${pm.doi}`, 1]);
  const acc = v.refseq_accession || (gl && gl.accession) || '';
  if (acc){
    const org = sp ? `&EQ_MENU=${encodeURIComponent(sp)}` : '';
    out.push([`${t().lBlast} (${acc})`,
      `https://blast.ncbi.nlm.nih.gov/Blast.cgi?PROGRAM=blastn&PAGE_TYPE=BlastSearch&BLAST_PROGRAMS=megaBlast&DATABASE=core_nt&QUERY=${encodeURIComponent(acc)}${org}`, 0]);
  } else {
    out.push([t().lFindSeq,
      `https://www.ncbi.nlm.nih.gov/nuccore/?term=${encodeURIComponent(gene.symbol + ' ' + sp)}`, 1]);
  }
  out.push([t().lPatent,
    `https://patents.google.com/?q=${encodeURIComponent('"' + gene.symbol + '" ' + entry.trait.split('(')[0].trim())}`, 1]);
  out.push([t().lPapers,
    `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(gene.symbol + ' ' + sp)}`, 1]);
  return out;
}

/* Locus tags live in crop genome databases, not NCBI — link them there. */
function locusLinks(e){
  const ids = (e.claims.gene_id || '').match(/[A-Za-z][A-Za-z0-9._]*\d[A-Za-z0-9._]*/g) || [];
  return ids.slice(0, 4).map(id => /^Solyc/.test(id)
    ? [id, `https://solgenomics.net/search/quick?term=${id}`]
    : [id, `https://plants.ensembl.org/Multi/Search/Results?q=${encodeURIComponent(id)}`]);
}

/* ---------- result card ---------- */
function card(e, i, idx){
  // The list is for scanning: the goal, the crop, and the three states. The
  // sentence explaining it, the gene symbols and everything else wait for the tap.
  const r = ready(e), rt = route(e), ip = ipState(e);
  return `<div class="card" data-${idx || 'i'}="${i}" tabindex="0" role="button">
    <div class="rail" style="background:${TONE(r.tone).dot}"></div>
    <div class="top"><div class="trait">${esc(goalPhrase(e))}</div><div class="crop">${esc(cropName(e.crop))}</div></div>
    <div class="chips">
      ${chip(r.tone, L(r).label)}${chip(rt.tone, L(rt).label)}${chip(ip.tone, L(ip).label.split(' — ')[0])}
    </div>
  </div>`;
}

/* ---------- detail sheet ---------- */
function sheet(e){
  const r = ready(e), rt = route(e), ip = ipState(e), s = t();
  const c = e.claims || {}, ver = e.verification || {};
  const ipText = (e.correction || {}).ip_signal
    ? (e.correction.ip_signal.status || '') : (c.patent_reference || '—');

  const genes = (e.genes || []).map(g => {
    const gv = g.verification || {};
    const hit = ((gv.ncbi_gene || {}).hits || [])[0];
    const gl = gv.genbank_locus;
    let meta;
    // name the species the database record is actually in — for a transfer entry
    // that is the source species, not the crop being targeted
    if (hit) meta = `${s.gFound} ${esc(hit.organism || '—')} ${s.gAs} ${esc(hit.official_symbol)} — ${esc(hit.description || '')}`;
    else if (gl && gl.accession) meta = `${s.gGenbank} ${esc(gl.accession)}`;
    else meta = s.gNone;
    return `<li><div class="gname">${esc(g.symbol)}</div>
      <div class="gmeta">${meta}</div>
      <div class="links">${geneLinks(g, e).map(([x, u]) =>
        `<a class="lk" href="${u}" target="_blank" rel="noopener">${esc(x)}</a>`).join('')}</div></li>`;
  }).join('');

  const loci = locusLinks(e);
  const lociBox = loci.length ? `<li><div class="gmeta" style="margin:0 0 2px">${s.locusBox}</div>
    <div class="links">${loci.map(([x, u]) =>

  const ipLink = `https://patents.google.com/?q=${encodeURIComponent('"' + (e.gene_label.split(',')[0] || '').trim() + '" ' + e.trait.split('(')[0].trim())}`;

  /* --- technical fold: the records, kept in the language the databases returned --- */
  const vals = [c.documented_in, c.target_note, c.gene_function, c.gene_action, c.trait_inheritance,
    c.tissue, c.editing_possibility, c.conventional_breeding, c.gene_id, c.commercial_product,
    c.linkage_drag, c.pleiotropic_effects, c.environmental_interaction, c.scientific_reference];
  const kv = vals.map((v, i) => v ? `<dt>${esc(s.kvLabels[i])}</dt><dd>${esc(v)}</dd>` : '').join('');

  const rec = c.recommended_strategy || '';
  const matrix = s.strategies.map((label, i) => {
    const enLabel = T.en.strategies[i];
    const on = rec && (enLabel.toLowerCase().includes(rec.toLowerCase().split(' ')[0]) ||
                       rec.toLowerCase().includes(enLabel.toLowerCase().split(' ')[0]));
    return `<div class="mrow${on ? ' pick' : ''}"><span class="m1">${esc(label)}</span>${on ? `<span>${s.recommended}</span>` : ''}</div>`;
  }).join('');

  const co = e.correction || {}, ev = e.evidence || {};
  const locus = ((e.locus_check || {}).results || []).map(x =>
    `<dt>${esc(x.locus)}</dt><dd>${esc(x.status)}</dd>`).join('');
  const oc = co.ortholog_candidate, ips = co.ip_signal;

  const tech = `
    <p class="tiny">${s.techNote}</p>
    <h3>${s.tRecords}</h3><dl class="kv">${kv}</dl>
    <h3>${s.tReady}</h3>
    <dl class="kv"><dt>${s.tLevel}</dt><dd><b>${esc(ev.derived_level || '—')}</b> — ${esc(ev.basis || '')}</dd>
      ${ev.draft_claimed ? `<dt>${s.tDraft}</dt><dd>${esc(ev.draft_claimed)}</dd>` : ''}
      <dt>${s.tVer}</dt><dd>${esc(ver.status || '')}${ver.genes_resolved ? ` · ${s.tGenesRes} ${esc(ver.genes_resolved)}` : ''}${ver.verified_on ? ` · ${s.tChecked} ${esc(ver.verified_on)}` : ''}</dd></dl>
    ${ev.disagrees_with_draft ? `<p class="warn">${esc(ev.disagrees_with_draft)}</p>` : ''}
    ${(ver.notes || []).length ? `<p class="warn">${(ver.notes || []).map(esc).join('<br>')}</p>` : ''}
    ${c.evidence_note ? `<p class="note">${s.tDraftNote} ${esc(c.evidence_note)}</p>` : ''}
    ${locus ? `<h3>${s.tLocus}</h3><dl class="kv">${locus}</dl>` : ''}
    <h3>${s.tRoute}</h3>${matrix}
    ${co.decision ? `<h3>${s.tDecision}</h3><p class="note">${esc(co.decision)}
      <span style="color:var(--txt3)">— ${esc(co.decided_by || '')}</span></p>
      ${co.rationale ? `<p class="tiny">${esc(co.rationale)}</p>` : ''}` : ''}
    ${co.commercial_status ? `<h3>${s.tWhyNot}</h3><p class="warn">${esc(co.commercial_status)}</p>` : ''}
    ${co.open_question ? `<h3>${s.tOpen}</h3><p class="warn">${esc(co.open_question)}</p>` : ''}
    ${oc ? `<h3>${s.tCand}</h3>
      <dl class="kv">${oc.gene ? `<dt>${s.tGene}</dt><dd><b>${esc(oc.gene)}</b></dd>` : ''}
        ${oc.status ? `<dt>${s.tStatus}</dt><dd>${esc(oc.status)}</dd>` : ''}
        ${oc.location ? `<dt>${s.tLoc}</dt><dd>${esc(oc.location)}</dd>` : ''}</dl>
      ${oc.why_this_one ? `<p class="note">${esc(oc.why_this_one)}</p>` : ''}
      ${oc.how_it_was_found ? `<p class="tiny">${esc(oc.how_it_was_found)}</p>` : ''}
      ${oc.what_this_is_not ? `<p class="warn">${esc(oc.what_this_is_not)}</p>` : ''}
      ${oc.limit ? `<p class="tiny">${esc(oc.limit)}</p>` : ''}` : ''}
    ${ips ? `<h3>${s.tClaims}</h3>
      <p class="warn">${esc(ips.status || '')}</p>
      ${ips.supplied_claim ? `<p class="tiny"><b>${s.tClaimChecked}:</b> ${esc(ips.supplied_claim)}</p>` : ''}
      ${(ips.what_is_true || []).length ? `<div class="note flat" style="margin-top:9px"><b>${s.tHolds}</b><ul style="margin:6px 0 0 17px">${
        ips.what_is_true.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${(ips.what_is_wrong || []).length ? `<div class="note flat" style="margin-top:9px"><b>${s.tWrong}</b><ul style="margin:6px 0 0 17px">${
        ips.what_is_wrong.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${(ips.live_members_to_clear || []).length ? `<p class="warn"><b>${s.tLive}:</b> ${
        ips.live_members_to_clear.map(esc).join(' · ')}</p>` : ''}
      ${ips.still_missing ? `<p class="tiny"><b>${s.tMissing}:</b> ${esc(ips.still_missing)}</p>` : ''}` : ''}
    <p class="tiny">${s.tDisc}</p>`;

  const gives = say(e, 'gives'), watch = say(e, 'watch'), why = say(e, 'why_not_product');

  el('sheet').innerHTML = `
    <div class="grab"><i></i></div>
    <button class="sh-close" id="x" aria-label="Close">✕</button>

function close(){ el('sheet').classList.remove('on'); el('scrim').classList.remove('on'); }
el('scrim').onclick = close;
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') close(); });

/* ---------- filtering ---------- */
/* A frontier entry names gene families rather than a validated locus: it is a
   research question, so it lives in its own tab rather than among targets. */
const isFrontier = e => /^GAP-/.test(e.id || '') || (e.evidence || {}).derived_level === 'Level 5';

function matches(e){
  if (CROP && CROP !== ALL && e.crop !== CROP) return false;
  if (GOAL && GOAL !== ALL && plain(e).goal !== GOAL) return false;
  return true;
}
function apply(){
  const s = t();
  // Nothing picked yet: keep the list closed and say what to do.
  if (!CROP && !GOAL) {
    SHOWN = [];
    el('results').innerHTML = `<div class="empty">${s.prompt}</div>`;
    el('count').innerHTML = '<span></span>';
    return;
  }
  SHOWN = ATLAS.entries.filter(e => !isFrontier(e) && matches(e)).sort((a, b) =>
    (ready(a).order - ready(b).order) || (route(a).order - route(b).order) ||
    a.crop.localeCompare(b.crop));
  const n = SHOWN.length;
  el('results').innerHTML = n ? SHOWN.map((e, i) => card(e, i)).join('')
    : `<div class="empty">${s.empty}<br><span style="font-size:13px">${s.emptyWhy}</span></div>`;
  const used = SHOWN.filter(e => (e.evidence || {}).derived_level === 'Level 1').length;
  const proven = SHOWN.filter(e => (e.evidence || {}).derived_level === 'Level 2').length;
  el('count').innerHTML = `<span><b>${n}</b> ${s.solutions[n === 1 ? 0 : 1]}` +
    (n ? ` · ${used} ${s.ofWhich} · ${proven} ${s.ofWhich2}` : '') + '</span>';
  bind('results', SHOWN, 'i');
}
function frontiers(){
  const f = ATLAS.entries.filter(isFrontier);
  el('frontier').innerHTML = f.map((e, i) => card(e, i, 'f')).join('')
    || `<div class="empty">${t().empty}</div>`;
  bind('frontier', f, 'f');
}
function bind(id, list, key){
  el(id).querySelectorAll('.card').forEach(c => {
    const open = () => sheet(list[+c.dataset[key]]);
    c.onclick = open;
    c.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } };
  });
}

/* ---------- pickers ---------- */
function options(sel, items, value){
  sel.innerHTML = items.map(([v, l, n]) =>
    `<option value="${esc(v)}"${v === value ? ' selected' : ''}>${esc(l)}${n == null ? '' : '  ' + n}</option>`).join('');
}
function drawCrops(){
  const counts = {};
  ATLAS.entries.filter(e => !isFrontier(e)).forEach(e => { counts[e.crop] = (counts[e.crop] || 0) + 1; });
  const total = ATLAS.entries.filter(e => !isFrontier(e)).length;
  if (CROP && CROP !== ALL && !counts[CROP]) CROP = '';
  options(el('f-crop'), [['', t().pickCrop, null], [ALL, t().allCrops, total]].concat(
    Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) => [c, cropName(c), n])), CROP);
}
function drawGoals(){
  const pool = ATLAS.entries.filter(e => !isFrontier(e) && (!CROP || CROP === ALL || e.crop === CROP));
  const counts = {};
  pool.forEach(e => { const g = plain(e).goal; if (g) counts[g] = (counts[g] || 0) + 1; });
  if (GOAL && GOAL !== ALL && !counts[GOAL]) GOAL = '';
  options(el('f-goal'), [['', t().pickGoal, null], [ALL, t().anything, pool.length]].concat(
    Object.keys(GOALS).filter(k => counts[k]).map(k => [k, goalName(k), counts[k]])), GOAL);
}
el('f-crop').onchange = () => { CROP = el('f-crop').value; drawGoals(); apply(); };
el('f-goal').onchange = () => { GOAL = el('f-goal').value; apply(); };

/* ---------- tabs ---------- */
function tab(name){
  document.querySelectorAll('.seg button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['explore','frontier','about'].forEach(x => el('panel-' + x).hidden = (x !== name));
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => tab(b.dataset.tab));
el('legend-link').onclick = ev => { ev.preventDefault(); tab('about'); window.scrollTo({top:0, behavior:'smooth'}); };

/* ---------- static chrome ---------- */
function drawChrome(){
  const s = t();
  document.documentElement.lang = LANG;
  el('t-sub').textContent = s.sub;
  el('t-tab1').textContent = s.tab1;
  el('t-tab2').textContent = s.tab2;
  el('t-tab3').textContent = s.tab3;
  el('t-lcrop').textContent = s.step1;
  el('t-lgoal').textContent = s.step2;
  el('t-frontier').textContent = s.frontierIntro;
  el('legend-link').textContent = s.legend;
  el('foot').innerHTML = s.foot.map(p => `<p>${p}</p>`).join('');
  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));

  const row = o => `<li><div class="gname" style="font-size:13px">${chip(o.tone, L(o).label)}</div>
    <div class="gmeta" style="font-size:12.5px;color:var(--txt2)">${esc(L(o).means)}</div></li>`;
  const st = ATLAS.stats || {}, sc = ATLAS._schema || {};
  const nums = [st.total_entries, st.verified, st.partial, st.unverified,
                st.genes_with_accession, st.last_verified];
  el('about-body').innerHTML =
    `<h3>${s.lgReady}</h3><ul class="glist">${Object.values(READY).filter(r => r.order < 5).map(row).join('')}</ul>
     <h3>${s.lgRoute}</h3><ul class="glist">${Object.values(ROUTE).map(row).join('')}</ul>
     <h3>${s.lgIp}</h3><ul class="glist">${[IP.named, IP.examined, IP.crowded, IP.unchecked, IP.open].map(row).join('')}</ul>
     <p class="tiny">${s.lgFoot}</p>
     <h3>${s.mVerified}</h3><p class="note flat">${esc(sc.principle || '')}</p>
     <h3>${s.mState}</h3><dl class="kv">${nums.map((v, i) =>
       v == null ? '' : `<dt>${esc(s.mStats[i])}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
     <h3>${s.mLimit}</h3><p class="note warn">${s.mLimitText}</p>
     <h3>${s.mRule}</h3><p class="note flat" style="font-size:12.5px">${esc(sc.level_derivation || '')}</p>`;
  el('asof').textContent = st.last_verified ? `${s.asof} ${st.last_verified}` : '';
}
function setLang(lang){
  LANG = (lang === 'tr') ? 'tr' : 'en';
  try { localStorage.setItem('ta-lang', LANG); } catch (err) { /* private mode */ }
  drawChrome(); drawCrops(); drawGoals(); apply(); frontiers(); close();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

/* ---------- boot ---------- */
let start = '';
try { start = localStorage.getItem('ta-lang') || ''; } catch (err) { start = ''; }
if (!start) start = /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
LANG = start === 'tr' ? 'tr' : 'en';

Promise.all([
  fetch('data/atlas_v3.json', {cache:'no-cache'}).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' — data/atlas_v3.json'); return r.json(); }),
  fetch('data/plain.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : {entries:{}, _about:{}})
]).then(([atlas, pl]) => {
  ATLAS = atlas;
  PLAIN = pl.entries || {};
  const a = pl._about || {};
  GOALS = a.goals || {}; GOALS_TR = a.goals_tr || {}; CROPS_TR = a.crops_tr || {};
  drawChrome(); drawCrops(); drawGoals(); apply(); frontiers();
}).catch(err => {
  el('results').innerHTML = `<div class="empty">Could not load the atlas data.<br>
    <span style="font-size:13px">${esc(err.message)}</span></div>`;
});
</script>
</body>
</html>
