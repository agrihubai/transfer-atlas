name: Patent / IP signal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan patents
        env:
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: python scripts/patent_scan.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/patents.tsv
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Update patent/IP signal layer"
            git push
          fi
